# ==============================================================================
# LOCAL DEVELOPMENT ONLY
# This docker-compose configuration is intended strictly for local development
# and automated integration testing. It is NOT a production deployment definition.
# All credentials, ports, and project names are supplied by the environment.
# In production, file storage connects to real AWS S3 or Cloudflare R2 via secure
# environment variables and IAM credentials.
# ==============================================================================
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: souklab-app:latest
    container_name: ${COMPOSE_PROJECT_NAME:-souklab}_app
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      mariadb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    networks:
      default:
        aliases:
          - backend

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "${MARIADB_HOST_PORT}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$${MARIADB_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  # Isolated schema target used only by scripts/verify-flyway.sh.
  mariadb-flyway:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: souklab_flyway_verification
      MARIADB_USER: ${FLYWAY_DB_USERNAME:-souklab_flyway}
      MARIADB_PASSWORD: ${FLYWAY_DB_PASSWORD:-souklab_flyway_password}
      MARIADB_ROOT_PASSWORD: ${FLYWAY_DB_ROOT_PASSWORD:-souklab_flyway_root}
    ports:
      - "${FLYWAY_MARIADB_HOST_PORT:-3308}:3306"
    volumes:
      - flyway_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$${MARIADB_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4.0-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    command: ["sh", "-c", "rabbitmq-plugins enable --offline rabbitmq_stomp && rabbitmq-server"]
    ports:
      - "5672:5672"
      - "61613:61613"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "3310"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-test-redis-password}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx1024m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ${FRONTEND_PATH:-../../nextjs/souklab-frontend/frontend}
      dockerfile: Dockerfile
    image: souklab-frontend:latest
    container_name: ${COMPOSE_PROJECT_NAME:-souklab}_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
      BACKEND_URL: http://app:8080
      BACKEND_PUBLIC_URL: ""
      NEXT_PUBLIC_CHAT_URL: ""
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      app:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: ${COMPOSE_PROJECT_NAME:-souklab}_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_started
      app:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    container_name: ${COMPOSE_PROJECT_NAME:-souklab}_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ${COMPOSE_PROJECT_NAME:-souklab}_ngrok
    restart: unless-stopped
    command: ["http", "nginx:80"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    ports:
      - "4040:4040"
    depends_on:
      - nginx
    profiles:
      - ngrok

volumes:
  mariadb_data:
    name: ${COMPOSE_PROJECT_NAME}_mariadb_data
  flyway_mariadb_data:
    name: ${COMPOSE_PROJECT_NAME}_flyway_mariadb_data
  rabbitmq_data:
    name: ${COMPOSE_PROJECT_NAME}_rabbitmq_data
  minio_data:
    name: ${COMPOSE_PROJECT_NAME}_minio_data_v2
  clamav_data:
    name: ${COMPOSE_PROJECT_NAME}_clamav_data
  es_data:
    name: ${COMPOSE_PROJECT_NAME}_es_data
  redis_data:
    name: ${COMPOSE_PROJECT_NAME}_redis_data
