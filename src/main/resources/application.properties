app.subscription.reminder-offsets=${SUBSCRIPTION_REMINDER_OFFSETS}
app.subscription.lifecycle-interval=${SUBSCRIPTION_LIFECYCLE_INTERVAL}
app.subscription.lifecycle-time-zone=${SUBSCRIPTION_LIFECYCLE_TIME_ZONE}
app.subscription.lifecycle-batch-size=${SUBSCRIPTION_LIFECYCLE_BATCH_SIZE}
app.subscription.minimum-plan-amount=${SUBSCRIPTION_MINIMUM_PLAN_AMOUNT}
app.subscription.maximum-plan-amount=${SUBSCRIPTION_MAXIMUM_PLAN_AMOUNT}
app.subscription.checkout-idempotency-retention=${SUBSCRIPTION_CHECKOUT_IDEMPOTENCY_RETENTION}
app.subscription.webhook-retention=${SUBSCRIPTION_WEBHOOK_RETENTION}

# Admin Seed Account (required via environment, no fallback)
app.admin.default-email=${APP_ADMIN_DEFAULT_EMAIL}
app.admin.default-password=${APP_ADMIN_DEFAULT_PASSWORD}
app.admin.bootstrap-enabled=${APP_ADMIN_BOOTSTRAP_ENABLED}
app.admin.default-ban-reason=${APP_ADMIN_DEFAULT_BAN_REASON}
app.admin.default-timeout-reason=${APP_ADMIN_DEFAULT_TIMEOUT_REASON}

# CORS Configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# WebSocket STOMP Broker Relay (RabbitMQ)
app.relay.host=${RELAY_HOST}
app.relay.port=${RELAY_PORT}
app.relay.client-login=${RELAY_CLIENT_LOGIN}
app.relay.client-passcode=${RELAY_CLIENT_PASSCODE}
app.relay.system-login=${RELAY_SYSTEM_LOGIN}
app.relay.system-passcode=${RELAY_SYSTEM_PASSCODE}

# Google OAuth Configuration
app.oauth.google.client-id=${GOOGLE_OAUTH_CLIENT_ID}
app.oauth.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET}
app.oauth.google.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI}
app.oauth.google.authorized-redirect-uri=${GOOGLE_OAUTH_AUTHORIZED_REDIRECT_URI:http://localhost/connexion/google}
app.oauth.intent-cookie-max-age-seconds=${OAUTH_INTENT_COOKIE_MAX_AGE_SECONDS}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI}

# Logging Levels (TRACE, DEBUG, INFO, WARN, ERROR)
logging.level.root=${APP_LOGGING_LEVEL_ROOT}
logging.level.com.project.souklab=${APP_LOGGING_LEVEL_APP}
logging.level.org.hibernate.search=${APP_LOGGING_LEVEL_SEARCH}
logging.level.org.hibernate.search.backend.elasticsearch.request=${APP_LOGGING_LEVEL_SEARCH_REQUESTS}
logging.level.org.hibernate.search.backend.elasticsearch.client.rest.request=${APP_LOGGING_LEVEL_SEARCH_REQUESTS}
logging.level.org.elasticsearch.client=${APP_LOGGING_LEVEL_ELASTICSEARCH}

# Operational endpoints. Details remain hidden and health groups are suitable for orchestrator probes.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.env.enabled=false
