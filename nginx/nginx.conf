user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 35M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Map for WebSocket Upgrade header
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Preserve upstream HTTPS proto (e.g. from ngrok, Cloudflare, or reverse proxies)
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        '' $scheme;
    }

    # Map default forwarded port based on effective protocol
    map $forwarded_proto $default_forwarded_port {
        https 443;
        default $server_port;
    }

    # Preserve upstream forwarded port if provided, otherwise default based on proto
    map $http_x_forwarded_port $forwarded_port {
        default $http_x_forwarded_port;
        '' $default_forwarded_port;
    }

    # Map external origins (LAN IPs, ngrok domains, public hostnames) to internal allowed origin
    map $http_origin $cors_origin {
        default "http://localhost:8080";
        "~^http://localhost(:[0-9]+)?$" $http_origin;
        "~^http://127\.0\.0\.1(:[0-9]+)?$" $http_origin;
        "~^http://192\.168\.100\.47(:[0-9]+)?$" $http_origin;
        "~^http://192\.168\.100\.3(:[0-9]+)?$" $http_origin;
        "~^https?://.*\.ngrok(-free)?\.app(:[0-9]+)?$" $http_origin;
        "" "";
    }

    upstream frontend_upstream {
        server frontend:3000;
        keepalive 32;
    }

    upstream backend_upstream {
        server backend:8080;
        keepalive 32;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # WebSocket STOMP relay endpoint (Realtime chat & notifications)
        location /ws {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header Origin "http://localhost:8080";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # Spring Boot REST API
        location /api/v1/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Origin $cors_origin;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 60s;
        }

        # OpenAPI specification & Swagger UI
        location ~ ^/(v3/api-docs|swagger-ui) {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Actuator health readiness endpoint
        location = /actuator/health {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Spring Security OAuth2 authorization and callback endpoints
        location ~ ^/(oauth2/|login/oauth2/) {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $forwarded_port;
            proxy_redirect http://0.0.0.0:8080/ /;
            proxy_redirect http://0.0.0.0:8080 /;
            proxy_redirect http://backend:8080/ /;
            proxy_redirect http://backend:8080 /;
            proxy_read_timeout 60s;
        }

        # Next.js Frontend (SSR & Static Assets)
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $forwarded_port;
            proxy_redirect http://0.0.0.0:3000/ /;
            proxy_redirect http://0.0.0.0:3000 /;
            proxy_redirect http://frontend:3000/ /;
            proxy_redirect http://frontend:3000 /;
            proxy_read_timeout 60s;
        }
    }
}
